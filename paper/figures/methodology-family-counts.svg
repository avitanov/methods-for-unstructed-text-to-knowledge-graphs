<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">Primary methodology assignment for the 83-paper corpus</title>
  <desc id="desc">Horizontal bar chart. Reviews have 12 papers; classical machine learning 9; neural pipelines and prompted LLMs 8 each; linguistic extraction 7; generative text-to-structure and joint extraction 6 each; rule-based NLP and validation or fusion 5 each; fine-tuned LLMs, schema-guided methods, and hybrid NLP-LLM systems 4 each; transformer encoders 3; and benchmarks or resources 2.</desc>
  <style>
    .title { font: 700 24px Arial, sans-serif; fill: #17365d; }
    .subtitle { font: 14px Arial, sans-serif; fill: #536273; }
    .label { font: 15px Arial, sans-serif; fill: #24364b; }
    .count { font: 700 15px Arial, sans-serif; fill: #17365d; }
    .axis { stroke: #aebbd0; stroke-width: 1; }
    .grid { stroke: #e1e7ef; stroke-width: 1; }
    .bar { fill: #4f78ad; }
    .bar-meta { fill: #8795a8; }
    .tick { font: 12px Arial, sans-serif; fill: #667085; text-anchor: middle; }
    .note { font: 13px Arial, sans-serif; fill: #536273; }
  </style>
  <rect width="960" height="720" fill="white"/>
  <text x="24" y="34" class="title">Primary methodology assignment (n = 83)</text>
  <text x="24" y="58" class="subtitle">Each paper contributes to exactly one bar; additional family memberships are reported separately.</text>

  <line x1="350" y1="82" x2="350" y2="650" class="axis"/>
  <line x1="550" y1="82" x2="550" y2="650" class="grid"/>
  <line x1="750" y1="82" x2="750" y2="650" class="grid"/>
  <line x1="830" y1="82" x2="830" y2="650" class="grid"/>
  <text x="350" y="671" class="tick">0</text>
  <text x="550" y="671" class="tick">5</text>
  <text x="750" y="671" class="tick">10</text>
  <text x="830" y="671" class="tick">12</text>

  <text x="24" y="105" class="label">Review / survey</text><rect x="350" y="90" width="480" height="20" rx="2" class="bar-meta"/><text x="840" y="105" class="count">12</text>
  <text x="24" y="145" class="label">Classical machine learning</text><rect x="350" y="130" width="360" height="20" rx="2" class="bar"/><text x="720" y="145" class="count">9</text>
  <text x="24" y="185" class="label">Neural NLP pipelines</text><rect x="350" y="170" width="320" height="20" rx="2" class="bar"/><text x="680" y="185" class="count">8</text>
  <text x="24" y="225" class="label">Prompted LLMs</text><rect x="350" y="210" width="320" height="20" rx="2" class="bar"/><text x="680" y="225" class="count">8</text>
  <text x="24" y="265" class="label">Linguistic / dependency extraction</text><rect x="350" y="250" width="280" height="20" rx="2" class="bar"/><text x="640" y="265" class="count">7</text>
  <text x="24" y="305" class="label">Generative text-to-structure</text><rect x="350" y="290" width="240" height="20" rx="2" class="bar"/><text x="600" y="305" class="count">6</text>
  <text x="24" y="345" class="label">Joint entity-relation extraction</text><rect x="350" y="330" width="240" height="20" rx="2" class="bar"/><text x="600" y="345" class="count">6</text>
  <text x="24" y="385" class="label">Rule-based NLP</text><rect x="350" y="370" width="200" height="20" rx="2" class="bar"/><text x="560" y="385" class="count">5</text>
  <text x="24" y="425" class="label">Validation / correction / fusion</text><rect x="350" y="410" width="200" height="20" rx="2" class="bar"/><text x="560" y="425" class="count">5</text>
  <text x="24" y="465" class="label">Fine-tuned LLMs</text><rect x="350" y="450" width="160" height="20" rx="2" class="bar"/><text x="520" y="465" class="count">4</text>
  <text x="24" y="505" class="label">Schema-guided methods</text><rect x="350" y="490" width="160" height="20" rx="2" class="bar"/><text x="520" y="505" class="count">4</text>
  <text x="24" y="545" class="label">Hybrid NLP-LLM systems</text><rect x="350" y="530" width="160" height="20" rx="2" class="bar"/><text x="520" y="545" class="count">4</text>
  <text x="24" y="585" class="label">Transformer encoders</text><rect x="350" y="570" width="120" height="20" rx="2" class="bar"/><text x="480" y="585" class="count">3</text>
  <text x="24" y="625" class="label">Benchmark / resource</text><rect x="350" y="610" width="80" height="20" rx="2" class="bar-meta"/><text x="440" y="625" class="count">2</text>

  <text x="24" y="705" class="note">Primary counts sum to 83. Review/resource categories are shown in grey and are not methodology families.</text>
</svg>
